<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0620">
<meta name="mobile-web-app-capable" content="yes">
<title>Habit Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0620; --panel:#150d33; --panel2:#1e1447; --line:#30246b;
  --text:#f1ecff; --dim:#9d93c9; --faint:#62588f;
  --pink:#ff3ea5; --cyan:#22e4ff; --lime:#9dff3a; --gold:#ffd23f; --purple:#b25cff; --orange:#ff8a3d;
  --accent:var(--pink); --accent2:var(--cyan);
  --pixel:'Press Start 2P', ui-monospace, monospace;
  --body:'Chakra Petch', system-ui, sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-accent="cyan"]{--accent:var(--cyan);--accent2:var(--pink)}
[data-accent="lime"]{--accent:var(--lime);--accent2:var(--purple)}
[data-accent="gold"]{--accent:var(--gold);--accent2:var(--cyan)}
[data-accent="purple"]{--accent:var(--purple);--accent2:var(--lime)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;overflow-x:hidden;
  user-select:none;-webkit-user-select:none}
input,textarea,button,select{font:inherit;color:inherit}
input,textarea{user-select:text;-webkit-user-select:text}
button{cursor:pointer;background:none;border:0;padding:0}

/* synthwave floor + sun */
.backdrop{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.backdrop::before{content:"";position:absolute;left:50%;top:14%;width:340px;height:340px;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),transparent 65%)}
.backdrop::after{content:"";position:absolute;left:-50%;right:-50%;bottom:-10%;height:45%;
  background:
   linear-gradient(to top,transparent 0,transparent 96%,color-mix(in srgb,var(--accent) 45%,transparent) 96%) 0 0/100% 34px,
   linear-gradient(to right,transparent 0,transparent 97%,color-mix(in srgb,var(--accent) 45%,transparent) 97%) 0 0/44px 100%;
  transform:perspective(260px) rotateX(62deg);transform-origin:bottom;opacity:.35;
  mask-image:linear-gradient(to top,#000 30%,transparent);-webkit-mask-image:linear-gradient(to top,#000 30%,transparent)}
.scan::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}

#app{max-width:520px;margin:0 auto;min-height:100%;padding:0 16px calc(96px + var(--safe-b))}

/* HUD */
.hud{position:sticky;top:0;z-index:20;padding:14px 0 12px;
  background:linear-gradient(var(--bg) 70%,transparent)}
.hud-row{display:flex;align-items:center;gap:10px}
.lvl{font-family:var(--pixel);font-size:10px;line-height:1;padding:8px 8px 7px;border:2px solid var(--accent);color:var(--accent);
  border-radius:6px;box-shadow:0 0 12px color-mix(in srgb,var(--accent) 55%,transparent),inset 0 0 8px color-mix(in srgb,var(--accent) 35%,transparent);
  text-shadow:0 0 6px var(--accent);white-space:nowrap}
.who{flex:1;min-width:0}
.who b{display:block;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.score{font-family:var(--pixel);font-size:12px;color:var(--gold);text-shadow:0 0 8px color-mix(in srgb,var(--gold) 70%,transparent);text-align:right}
.score small{display:block;font-size:7px;color:var(--dim);text-shadow:none;margin-bottom:5px;letter-spacing:.1em}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--panel);border:1px solid var(--line)}
.xpbar{margin-top:12px;height:14px;border-radius:4px;background:var(--panel);border:1px solid var(--line);overflow:hidden;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,color-mix(in srgb,var(--accent) 75%,#fff) 10px 12px);
  box-shadow:0 0 14px var(--accent);transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.xpbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--pixel);font-size:7px;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
.score small.combo{color:var(--orange);text-shadow:0 0 6px var(--orange);animation:pulse .5s infinite alternate}
@keyframes pulse{to{opacity:.55}}

/* sections */
h2{font-family:var(--pixel);font-size:11px;letter-spacing:.06em;color:var(--accent2);text-shadow:0 0 8px color-mix(in srgb,var(--accent2) 60%,transparent);
  margin:22px 0 12px;display:flex;align-items:center;gap:8px}
h2 .ct{margin-left:auto;color:var(--dim);text-shadow:none;font-size:9px}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.daynav button{font-family:var(--pixel);font-size:12px;width:40px;height:36px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.daynav button:disabled{opacity:.25}
.daynav .d{font-family:var(--pixel);font-size:11px;text-align:center}
.daynav .d small{display:block;font-family:var(--body);font-size:13px;color:var(--dim);margin-top:6px}

/* cards */
.card{position:relative;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  margin-bottom:10px;transition:transform .12s,background .2s,border-color .2s,box-shadow .2s}
.card:active{transform:scale(.98)}
.quest{--c:var(--accent)}
.quest .ico{width:48px;height:48px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:26px;
  background:color-mix(in srgb,var(--c) 14%,var(--panel2));border:2px solid color-mix(in srgb,var(--c) 45%,transparent)}
.quest .txt{flex:1;min-width:0}
.quest .txt b{display:block;font-size:16px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.quest .txt small{display:flex;gap:10px;color:var(--dim);font-size:13px;margin-top:4px}
.flame{color:var(--orange)}
.flame.cold{color:var(--faint);filter:grayscale(1) brightness(.6)}
.chk{width:40px;height:40px;flex:none;border-radius:10px;border:2px solid color-mix(in srgb,var(--c) 70%,transparent);display:grid;place-items:center;
  font-family:var(--pixel);font-size:14px;color:transparent}
.quest.done{background:color-mix(in srgb,var(--c) 16%,var(--panel));border-color:color-mix(in srgb,var(--c) 70%,transparent);
  box-shadow:0 0 18px color-mix(in srgb,var(--c) 28%,transparent)}
.quest.done .chk{background:var(--c);color:var(--bg);box-shadow:0 0 14px var(--c)}
.quest.done .txt b{opacity:.85}
.more{width:32px;height:40px;flex:none;color:var(--faint);font-size:20px;display:grid;place-items:center;margin-left:-6px}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.94)}50%{transform:scale(1.04)}100%{transform:scale(1)}}

.todo{padding:10px 12px;gap:10px}
.todo .chk{width:30px;height:30px;border-radius:8px;font-size:11px;--c:var(--accent2)}
.todo b{flex:1;font-weight:500;overflow-wrap:anywhere}
.todo.done{--c:var(--accent2)}
.todo.done b{text-decoration:line-through;color:var(--dim)}
.todo.done .chk{background:var(--accent2);color:var(--bg)}
.addrow{display:flex;gap:8px;margin-bottom:10px}
.field{width:100%;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
textarea.field{resize:none;min-height:80px}
.btn{font-family:var(--pixel);font-size:10px;padding:14px 16px;border-radius:12px;background:var(--accent);color:var(--bg);
  box-shadow:0 0 16px color-mix(in srgb,var(--accent) 55%,transparent),0 4px 0 color-mix(in srgb,var(--accent) 50%,#000);white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 55%,transparent),0 1px 0 color-mix(in srgb,var(--accent) 50%,#000)}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:0 4px 0 #000;border:1px solid var(--line)}
.btn.danger{background:#ff3e6c;box-shadow:0 0 12px #ff3e6c88,0 4px 0 #7a1030}
.btn.block{display:block;width:100%}
.empty{padding:18px;border:2px dashed var(--line);border-radius:14px;text-align:center;color:var(--dim);font-size:14px;line-height:1.5}
.empty .pix{font-family:var(--pixel);font-size:9px;color:var(--accent);display:block;margin-bottom:8px}
.perfect{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14px;color:var(--dim)}
.perfect .bar{flex:1;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.perfect .bar i{display:block;height:100%;background:var(--gold);box-shadow:0 0 10px var(--gold);transition:width .5s}
.perfect.won{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 60%,transparent);font-family:var(--pixel);font-size:9px;justify-content:center}
.linkbtn{color:var(--dim);font-size:13px;text-decoration:underline;margin:4px auto 0;display:block}

/* goals */
.goal{display:block;padding:14px;--c:var(--accent)}
.goal-top{display:flex;align-items:center;gap:12px}
.goal-top .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 14%,var(--panel2));border:2px solid color-mix(in srgb,var(--c) 45%,transparent)}
.goal-top b{flex:1;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.hp{margin-top:12px;display:flex;align-items:center;gap:10px;font-family:var(--pixel);font-size:8px;color:var(--dim)}
.hp .bar{flex:1;height:12px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.hp .bar i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .5s}
.ms{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.ms:first-of-type{margin-top:12px}
.ms .chk{width:26px;height:26px;border-radius:7px;font-size:9px}
.ms.done .chk{background:var(--c);color:var(--bg)}
.ms.done span{text-decoration:line-through;color:var(--dim)}
.ms span{flex:1;overflow-wrap:anywhere}
.ms .x{color:var(--faint);padding:4px 6px}
.goal.won{border-color:color-mix(in srgb,var(--gold) 60%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--gold) 20%,transparent)}
.defeated{font-family:var(--pixel);font-size:8px;color:var(--gold);margin-top:10px}

/* mood */
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.face{aspect-ratio:1;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-size:30px;display:grid;place-items:center;transition:transform .15s}
.face.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--panel));box-shadow:0 0 16px color-mix(in srgb,var(--c) 50%,transparent);transform:scale(1.06)}
.facelabel{text-align:center;font-family:var(--pixel);font-size:9px;margin:12px 0;min-height:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-family:var(--pixel);font-size:7px;color:var(--faint);text-align:center;padding-bottom:4px}
.cal .cell{aspect-ratio:1;border-radius:6px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:10px;color:var(--faint)}
.cal .cell.has{border:0;color:var(--bg);font-weight:700;box-shadow:0 0 8px color-mix(in srgb,var(--c) 45%,transparent);background:var(--c)}
.cal .cell.today{outline:2px solid var(--text);outline-offset:1px}
.note{padding:10px 12px;border-left:3px solid var(--c);background:var(--panel);border-radius:0 10px 10px 0;margin-bottom:8px;font-size:14px}
.note small{display:block;color:var(--dim);font-size:12px;margin-bottom:3px}

/* trophies */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-family:var(--pixel);font-size:13px;color:var(--accent);text-shadow:0 0 8px color-mix(in srgb,var(--accent) 50%,transparent)}
.stat small{display:block;margin-top:8px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{padding:12px 6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:center}
.badge .bi{font-size:30px;height:40px;display:grid;place-items:center}
.badge b{display:block;font-size:12px;font-weight:700;margin-top:6px;line-height:1.2}
.badge small{display:block;font-size:11px;color:var(--dim);margin-top:4px;line-height:1.25}
.badge.got{border-color:color-mix(in srgb,var(--gold) 55%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--gold) 18%,transparent)}
.badge.got b{color:var(--gold)}
.badge:not(.got) .bi{filter:grayscale(1) brightness(.45)}
.badge:not(.got) b{color:var(--faint)}
.titles{font-size:14px;color:var(--dim);line-height:1.8}
.titles .cur{color:var(--accent);font-weight:700}

/* bottom nav + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b))}
.tabs-in{display:flex;width:100%;max-width:520px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;border-radius:10px;color:var(--faint)}
.tab .ti{font-size:21px;filter:grayscale(1) brightness(.7);transition:transform .2s}
.tab span{font-family:var(--pixel);font-size:7px}
.tab.on{color:var(--accent)}
.tab.on .ti{filter:none;transform:translateY(-2px) scale(1.12)}
.fab{position:fixed;z-index:31;right:max(16px,calc(50% - 244px));bottom:calc(84px + var(--safe-b));width:58px;height:58px;border-radius:16px;
  background:var(--accent);color:var(--bg);font-family:var(--pixel);font-size:22px;display:grid;place-items:center;
  box-shadow:0 0 22px color-mix(in srgb,var(--accent) 70%,transparent),0 5px 0 color-mix(in srgb,var(--accent) 45%,#000)}
.fab:active{transform:translateY(4px)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(5,2,15,.7);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;max-height:88vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:10px 16px calc(20px + var(--safe-b));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.sheet.open{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--pixel);font-size:12px;color:var(--accent);margin:4px 0 18px;text-shadow:0 0 8px color-mix(in srgb,var(--accent) 55%,transparent)}
.lbl{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{aspect-ratio:1;border-radius:10px;background:var(--panel2);border:2px solid transparent;font-size:20px}
.emojis button.on{border-color:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 50%,transparent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:10px;background:var(--c);border:3px solid transparent;box-shadow:0 0 10px color-mix(in srgb,var(--c) 50%,transparent)}
.sw.on{border-color:#fff}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{height:42px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-family:var(--pixel);font-size:9px;color:var(--dim)}
.days button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.row{display:flex;gap:10px;margin-top:22px}
.row .btn{flex:1}
.menu{display:grid;gap:10px}
.menu button{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);text-align:left}
.menu .mi{font-size:28px}
.menu b{display:block;font-family:var(--pixel);font-size:10px;color:var(--accent);margin-bottom:6px}
.menu small{color:var(--dim);font-size:13px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle i{width:48px;height:28px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:6px;background:var(--dim);transition:transform .2s,background .2s}
.toggle.on i{background:color-mix(in srgb,var(--accent) 35%,var(--panel2))}
.toggle.on i::after{transform:translateX(20px);background:var(--accent)}

/* fx */
#fx{position:fixed;inset:0;z-index:80;pointer-events:none}
.floater{position:fixed;z-index:81;pointer-events:none;font-family:var(--pixel);font-size:12px;color:var(--gold);
  text-shadow:0 0 8px var(--gold),0 2px 0 #000;animation:floatup 1.1s ease-out forwards;white-space:nowrap}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.toasts{position:fixed;top:10px;left:0;right:0;z-index:85;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:12px;max-width:420px;width:100%;padding:12px 14px;border-radius:14px;background:var(--panel2);
  border:2px solid var(--gold);box-shadow:0 0 22px color-mix(in srgb,var(--gold) 45%,transparent);animation:toastin .4s cubic-bezier(.2,1.4,.4,1)}
.toast .bi{font-size:30px}
.toast small{display:block;font-family:var(--pixel);font-size:7px;color:var(--gold);margin-bottom:6px}
.toast b{font-weight:700}
.toast.out{animation:toastout .3s forwards}
@keyframes toastin{from{transform:translateY(-120%)}}
@keyframes toastout{to{transform:translateY(-140%);opacity:0}}
.levelup{position:fixed;inset:0;z-index:88;display:grid;place-items:center;background:rgba(5,2,15,.82);animation:fadein .2s}
.levelup div{text-align:center;padding:0 20px}
.levelup h1{font-family:var(--pixel);font-size:28px;line-height:1.3;margin:0;color:var(--gold);text-shadow:0 0 14px var(--gold),0 4px 0 #7a4b00;animation:bounce .6s cubic-bezier(.2,1.6,.4,1)}
.levelup p{font-family:var(--pixel);font-size:11px;color:var(--accent);margin:22px 0 8px;line-height:1.8}
.levelup small{color:var(--dim);font-size:14px}
@keyframes fadein{from{opacity:0}}
@keyframes bounce{from{transform:scale(.3)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="backdrop"></div>
<div id="app">
  <header class="hud" id="hud"></header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="Add">+</button>
<nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog"></div>
<div class="toasts" id="toasts"></div>
<canvas id="fx"></canvas>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ============ constants ============ */
const KEY = 'habitArcade.v1';
const COLORS = {pink:'#ff3ea5',cyan:'#22e4ff',lime:'#9dff3a',gold:'#ffd23f',purple:'#b25cff',orange:'#ff8a3d'};

/* ============ utils ============ */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return dkey(d); };
const todayKey = () => dkey(new Date());
const dowOf = k => parseKey(k).getDay();
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n.toLocaleString();
const levelOf = xp => { let L = 1; while (xp >= 50*L*(L+1)) L++; return L; };
const xpAt = L => 50*(L-1)*L;
const titleOf = L => TITLES.filter(t => L >= t[0]).pop()[1];

/* ============ state ============ */
function fresh(){
  return {
    v:1,
    player:{name:'Player 1', xp:0, created:todayKey()},
    settings:{accent:'pink', sound:true, scan:true},
    habits:[], habitLog:{}, todos:[], goals:[], moods:{}, perfectDays:{},
    badges:{}, combo:{count:0,last:0},
    stats:{habits:0,todos:0,milestones:0,goals:0,moods:0,bestStreak:0,perfect:0,maxCombo:0,early:false,owl:false},
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) { S = null; }
if (!S) S = fresh();
S = Object.assign(fresh(), S);
S.stats = Object.assign(fresh().stats, S.stats);
S.settings = Object.assign(fresh().settings, S.settings);

function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}

const ui = {tab:'today', day:todayKey(), openGoals:{}, mood:null, popId:null};

/* ============ sound ============ */
let AC = null;
function tone(seq, type='square', vol=0.05){
  if (!S.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    for (const [f,d] of seq){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
      t += d * 0.85;
    }
  } catch(e) {}
}
const sfx = {
  check: c => tone([[523+c*40,.07],[784+c*60,.11]]),
  uncheck: () => tone([[392,.07],[262,.1]], 'triangle'),
  level: () => tone([[523,.1],[659,.1],[784,.1],[1047,.1],[784,.08],[1047,.3]]),
  badge: () => tone([[880,.08],[1175,.08],[1568,.22]], 'triangle', .06),
  boss: () => tone([[392,.1],[523,.1],[659,.1],[784,.12],[1047,.12],[1319,.35]]),
  tap: () => tone([[660,.04]], 'triangle', .03),
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e) {} };

/* ============ fx ============ */
const cv = $('#fx'), cx = cv.getContext('2d');
let parts = [], raf = 0;
function sizeFx(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
sizeFx(); addEventListener('resize', sizeFx);
function burst(x, y, colors, n=26, spread=1){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = (2+Math.random()*5)*spread;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,s:3+Math.random()*4,c:colors[i%colors.length],life:1});
  }
  if (!raf) raf = requestAnimationFrame(step);
}
function confetti(){
  const cols = Object.values(COLORS);
  for (let i=0;i<5;i++) setTimeout(() => burst(innerWidth*(.15+Math.random()*.7), innerHeight*(.25+Math.random()*.3), cols, 40, 1.4), i*140);
}
function step(){
  const r = devicePixelRatio; cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts){
    p.x += p.vx; p.y += p.vy; p.vy += .22; p.vx *= .98; p.life -= .018;
    cx.globalAlpha = Math.max(p.life,0); cx.fillStyle = p.c;
    cx.fillRect(Math.round(p.x*r), Math.round(p.y*r), p.s*r, p.s*r);
  }
  raf = parts.length ? requestAnimationFrame(step) : 0;
  if (!raf) cx.clearRect(0,0,cv.width,cv.height);
}
function floater(x, y, text, color){
  const el = document.createElement('div');
  el.className = 'floater'; el.textContent = text;
  el.style.left = x+'px'; el.style.top = (y-10)+'px';
  if (color) { el.style.color = color; el.style.textShadow = `0 0 8px ${color},0 2px 0 #000`; }
  document.body.appendChild(el); setTimeout(() => el.remove(), 1200);
}
function toast(icon, small, text){
  const el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = `<div class="bi">${icon}</div><div><small>${esc(small)}</small><b>${esc(text)}</b></div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 2800);
}
function levelUpScreen(L){
  const el = document.createElement('div');
  el.className = 'levelup';
  el.innerHTML = `<div><h1>LEVEL<br>UP!</h1><p>LV ${L} · ${esc(titleOf(L).toUpperCase())}</p><small>tap to continue</small></div>`;
  el.onclick = () => el.remove();
  document.body.appendChild(el);
  sfx.level(); buzz([30,40,30,40,80]); confetti();
  setTimeout(() => el.isConnected && el.remove(), 3500);
}

/* ============ game logic ============ */
function giveXP(amount, at){
  const before = levelOf(S.player.xp);
  S.player.xp = Math.max(0, S.player.xp + amount);
  const after = levelOf(S.player.xp);
  if (at && amount) floater(at.x, at.y, (amount > 0 ? '+' : '') + amount + ' XP', amount < 0 ? '#9d93c9' : null);
  if (after > before) setTimeout(() => levelUpScreen(after), 450);
}
function bumpCombo(){
  const now = Date.now();
  S.combo.count = (now - S.combo.last < COMBO_WINDOW) ? S.combo.count + 1 : 1;
  S.combo.last = now;
  S.stats.maxCombo = Math.max(S.stats.maxCombo, S.combo.count);
  const h = new Date().getHours();
  if (h < 7) S.stats.early = true;
  if (h >= 23) S.stats.owl = true;
  return Math.min((S.combo.count - 1) * 2, 10);
}
function checkBadges(){
  let delay = 300;
  for (const b of BADGES){
    if (!S.badges[b.id] && b.t(S)){
      S.badges[b.id] = todayKey();
      setTimeout(() => { toast(b.i, 'ACHIEVEMENT UNLOCKED', b.n); sfx.badge(); buzz(60); }, delay);
      delay += 700;
    }
  }
}
function centerOf(el){ if (!el) return null; const r = el.getBoundingClientRect(); return {x:r.left + r.width/2, y:r.top + r.height/2}; }

const activeHabits = k => S.habits.filter(h => h.created <= k);
const scheduled = (h,k) => h.days.includes(dowOf(k));
const isDone = (h,k) => !!(S.habitLog[k] && S.habitLog[k][h.id] !== undefined);
function streakOf(h, k){
  let n = 0, cur = k;
  if (!isDone(h,cur)) cur = addDays(cur,-1);
  for (let i=0; i<2000 && cur >= h.created; i++){
    if (scheduled(h,cur)){ if (isDone(h,cur)) n++; else break; }
    cur = addDays(cur,-1);
  }
  return n;
}
function dueHabits(k){ return activeHabits(k).filter(h => scheduled(h,k)); }

function toggleHabit(id, el){
  const h = S.habits.find(x => x.id === id); if (!h) return;
  const k = ui.day, at = centerOf(el && el.querySelector('.chk'));
  S.habitLog[k] = S.habitLog[k] || {};
  if (isDone(h,k)){
    const got = S.habitLog[k][id];
    delete S.habitLog[k][id];
    S.stats.habits = Math.max(0, S.stats.habits - 1);
    let back = got;
    if (S.perfectDays[k]){ back += S.perfectDays[k]; delete S.perfectDays[k]; S.stats.perfect = Math.max(0, S.stats.perfect-1); }
    giveXP(-back, at); sfx.uncheck(); buzz(15);
  } else {
    S.habitLog[k][id] = 0;
    const st = streakOf(h,k);
    const bonus = bumpCombo();
    const amt = XP.habit + Math.min(st,10) + bonus;
    S.habitLog[k][id] = amt;
    S.stats.habits++;
    S.stats.bestStreak = Math.max(S.stats.bestStreak, st);
    giveXP(amt, at); sfx.check(S.combo.count); buzz(25);
    if (at) burst(at.x, at.y, [COLORS[h.color] || COLORS.pink, '#fff', COLORS.gold]);
    const due = dueHabits(k);
    if (due.length && due.every(x => isDone(x,k)) && !S.perfectDays[k]){
      S.perfectDays[k] = XP.perfect; S.stats.perfect++; giveXP(XP.perfect);
      setTimeout(() => { toast('⭐', 'PERFECT ROUND', `All quests cleared! +${XP.perfect} XP`); confetti(); sfx.boss(); }, 500);
    }
    ui.popId = id;
  }
  checkBadges(); save(); render();
}

function toggleTodo(id, el){
  const t = S.todos.find(x => x.id === id); if (!t) return;
  const at = centerOf(el && el.querySelector('.chk'));
  if (t.done){
    t.done = false; giveXP(-(t.xp||0), at); t.xp = 0; t.doneKey = null;
    S.stats.todos = Math.max(0, S.stats.todos-1); sfx.uncheck(); buzz(15);
  } else {
    const amt = XP.todo + bumpCombo();
    t.done = true; t.xp = amt; t.doneKey = todayKey(); S.stats.todos++;
    giveXP(amt, at); sfx.check(S.combo.count); buzz(25);
    if (at) burst(at.x, at.y, [COLORS.cyan, '#fff', COLORS.pink], 18);
  }
  checkBadges(); save(); render();
}

function toggleMilestone(gid, mid, el){
  const g = S.goals.find(x => x.id === gid); if (!g) return;
  const m = g.milestones.find(x => x.id === mid); if (!m) return;
  const at = centerOf(el && el.querySelector('.chk'));
  if (m.done){
    m.done = false; giveXP(-(m.xp||0), at); m.xp = 0; S.stats.milestones = Math.max(0,S.stats.milestones-1);
    if (g.done) uncompleteGoal(g);
    sfx.uncheck();
  } else {
    const amt = XP.milestone + bumpCombo();
    m.done = true; m.xp = amt; S.stats.milestones++;
    giveXP(amt, at); sfx.check(S.combo.count); buzz(25);
    if (at) burst(at.x, at.y, [COLORS[g.color] || COLORS.pink, '#fff']);
    if (g.milestones.every(x => x.done)) completeGoal(g);
  }
  checkBadges(); save(); render();
}
function completeGoal(g){
  g.done = true; g.doneKey = todayKey(); S.stats.goals++; giveXP(XP.goal);
  setTimeout(() => { toast(g.icon, 'BOSS DEFEATED', `${g.name} · +${XP.goal} XP`); confetti(); sfx.boss(); buzz([40,40,40,40,120]); }, 350);
}
function uncompleteGoal(g){ g.done = false; g.doneKey = null; S.stats.goals = Math.max(0,S.stats.goals-1); giveXP(-XP.goal); }

function saveMood(v, note){
  const k = todayKey(), had = !!S.moods[k];
  S.moods[k] = {v, note:(note||'').trim()};
  if (!had){ S.stats.moods++; giveXP(XP.mood, centerOf($('#moodSave'))); }
  const m = MOODS.find(x => x.v === v);
  sfx.check(0); buzz(20);
  const r = centerOf($('#moodSave')); if (r) burst(r.x, r.y, [m.c,'#fff'], 20);
  toast(m.e, had ? 'CHECK-IN UPDATED' : `CHECK-IN SAVED · +${XP.mood} XP`, `Feeling ${m.label.toLowerCase()}`);
  checkBadges(); save(); render();
}

/* ============ rendering ============ */
function renderHud(){
  const xp = S.player.xp, L = levelOf(xp), lo = xpAt(L), hi = xpAt(L+1);
  const pct = Math.min(100, (xp - lo) / (hi - lo) * 100);
  const combo = (Date.now() - S.combo.last < COMBO_WINDOW && S.combo.count >= 2) ? `<small class="combo">COMBO x${S.combo.count}</small>` : '<small>SCORE</small>';
  $('#hud').innerHTML = `
    <div class="hud-row">
      <div class="lvl">LV ${L}</div>
      <div class="who"><b>${esc(S.player.name)}</b><small>${esc(titleOf(L))}</small></div>
      <div class="score">${combo}${fmt(xp)}</div>
      <button class="icon-btn" data-a="settings" aria-label="Settings">⚙️</button>
    </div>
    <div class="xpbar"><i style="width:${pct}%"></i><span>${fmt(xp-lo)} / ${fmt(hi-lo)} XP</span></div>`;
}

function renderTabs(){
  const tabs = [['today','🎮','QUESTS'],['goals','👾','BOSSES'],['mood','💜','MOOD'],['trophies','🏆','TROPHIES']];
  $('#tabs').innerHTML = tabs.map(([id,i,l]) => `<button class="tab ${ui.tab===id?'on':''}" data-a="tab" data-id="${id}"><span class="ti">${i}</span><span>${l}</span></button>`).join('');
  $('#fab').style.display = (ui.tab === 'today' || ui.tab === 'goals') ? '' : 'none';
}

function dayLabel(k){
  const t = todayKey();
  if (k === t) return 'TODAY';
  if (k === addDays(t,-1)) return 'YESTERDAY';
  return parseKey(k).toLocaleDateString(undefined,{weekday:'short'}).toUpperCase();
}

function viewToday(){
  const k = ui.day, t = todayKey();
  const due = dueHabits(k);
  const doneN = due.filter(h => isDone(h,k)).length;
  const off = activeHabits(k).filter(h => !scheduled(h,k));
  const habitCard = h => {
    const done = isDone(h,k), st = streakOf(h,k);
    return `<div class="card quest ${done?'done':''} ${ui.popId===h.id?'pop':''}" style="--c:${COLORS[h.color]||COLORS.pink}" data-a="habit" data-id="${h.id}">
      <div class="ico">${h.icon}</div>
      <div class="txt"><b>${esc(h.name)}</b><small><span class="flame ${st?'':'cold'}">🔥 ${st}</span>${done?`<span>+${S.habitLog[k][h.id]} XP</span>`:`<span>+${XP.habit+Math.min(st+1,10)} XP</span>`}</small></div>
      <div class="chk">✓</div>
      <button class="more" data-a="editHabit" data-id="${h.id}" aria-label="Edit">⋮</button>
    </div>`;
  };
  let html = `<div class="daynav">
      <button data-a="day" data-d="-1" ${k <= addDays(t,-2) ? 'disabled':''}>‹</button>
      <div class="d">${dayLabel(k)}<small>${parseKey(k).toLocaleDateString(undefined,{month:'long',day:'numeric'})}</small></div>
      <button data-a="day" data-d="1" ${k >= t ? 'disabled':''}>›</button>
    </div>`;
  html += `<h2>▸ DAILY QUESTS <span class="ct">${doneN}/${due.length}</span></h2>`;
  if (!S.habits.length){
    html += `<div class="empty"><span class="pix">NO QUESTS YET</span>Tap <b>+</b> to add your first daily habit.<br>Every check-in earns XP and builds a 🔥 streak.</div>`;
  } else if (!due.length){
    html += `<div class="empty"><span class="pix">REST DAY</span>No habits scheduled for this day.</div>`;
  } else {
    html += due.map(habitCard).join('');
    const won = !!S.perfectDays[k];
    html += won ? `<div class="perfect won">⭐ PERFECT ROUND ⭐</div>`
      : `<div class="perfect"><span>⭐</span>Perfect round <div class="bar"><i style="width:${doneN/due.length*100}%"></i></div> +${XP.perfect}</div>`;
  }
  if (off.length) html += `<div style="color:var(--faint);font-size:13px;margin-top:10px">Off today: ${off.map(h => h.icon+' '+esc(h.name)).join(' · ')}</div>`;

  if (k === t){
    const open = S.todos.filter(x => !x.done), cleared = S.todos.filter(x => x.done && x.doneKey === t);
    html += `<h2>▸ SIDE QUESTS <span class="ct">${cleared.length} cleared</span></h2>
      <form class="addrow" data-form="todo"><input class="field" name="text" placeholder="Add a to-do…" autocomplete="off" enterkeyhint="done"><button class="btn" type="submit">ADD</button></form>`;
    const todo = x => `<div class="card todo ${x.done?'done':''}" data-a="todo" data-id="${x.id}"><div class="chk">✓</div><b>${esc(x.text)}</b>${x.done?`<small style="color:var(--gold);font-family:var(--pixel);font-size:8px">+${x.xp}</small>`:''}<button class="more" data-a="editTodo" data-id="${x.id}" aria-label="Edit">⋮</button></div>`;
    html += open.map(todo).join('') + cleared.map(todo).join('');
    if (!open.length && !cleared.length) html += `<div class="empty">One-off tasks go here. +${XP.todo} XP each.</div>`;
  }
  return html;
}

function viewGoals(){
  let html = `<h2>▸ BOSS BATTLES <span class="ct">${S.goals.filter(g=>g.done).length} defeated</span></h2>`;
  if (!S.goals.length) return html + `<div class="empty"><span class="pix">NO BOSSES YET</span>Big goals are boss fights. Break one into milestones<br>(+${XP.milestone} XP each), then defeat it for +${XP.goal} XP.</div>`;
  const sorted = [...S.goals].sort((a,b) => a.done - b.done);
  html += sorted.map(g => {
    const n = g.milestones.length, d = g.milestones.filter(m => m.done).length;
    const open = ui.openGoals[g.id] ?? !g.done;
    return `<div class="card goal ${g.done?'won':''}" style="--c:${COLORS[g.color]||COLORS.pink}">
      <div class="goal-top" data-a="goalToggle" data-id="${g.id}">
        <div class="ico">${g.icon}</div><b>${esc(g.name)}</b>
        <button class="more" data-a="editGoal" data-id="${g.id}" aria-label="Edit">⋮</button>
      </div>
      <div class="hp"><span>${g.done?'KO':'HP'}</span><div class="bar"><i style="width:${n? (d/n*100):(g.done?100:0)}%"></i></div><span>${d}/${n}</span></div>
      ${g.done ? `<div class="defeated">🏆 DEFEATED ${parseKey(g.doneKey).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>`:''}
      ${open ? g.milestones.map(m => `<div class="ms ${m.done?'done':''}" data-a="ms" data-g="${g.id}" data-id="${m.id}"><div class="chk">✓</div><span>${esc(m.text)}</span><button class="x" data-a="delMs" data-g="${g.id}" data-id="${m.id}" aria-label="Remove">✕</button></div>`).join('')
        + (g.done ? '' : `<form class="addrow" data-form="ms" data-g="${g.id}" style="margin:12px 0 0"><input class="field" name="text" placeholder="Add a milestone…" autocomplete="off" enterkeyhint="done"><button class="btn" type="submit">+</button></form>`) : ''}
    </div>`;
  }).join('');
  return html;
}

function viewMood(){
  const k = todayKey(), cur = S.moods[k];
  const sel = ui.mood ?? (cur ? cur.v : null);
  const m = MOODS.find(x => x.v === sel);
  let html = `<h2>▸ HOW ARE YOU, ${esc(S.player.name.toUpperCase())}?</h2>
    <div class="faces">${MOODS.map(x => `<button class="face ${sel===x.v?'on':''}" style="--c:${x.c}" data-a="face" data-v="${x.v}">${x.e}</button>`).join('')}</div>
    <div class="facelabel" style="color:${m?m.c:'var(--dim)'}">${m ? m.label : 'PICK ONE'}</div>
    <textarea class="field" id="moodNote" placeholder="What's on your mind? (optional)">${esc(cur?.note || '')}</textarea>
    <button class="btn block" id="moodSave" data-a="saveMood" style="margin-top:12px" ${sel?'':'disabled'}>${cur ? 'UPDATE CHECK-IN' : `CHECK IN · +${XP.mood} XP`}</button>`;
  // 5-week calendar ending this week
  const start = addDays(k, -(dowOf(k) + 28));
  html += `<h2>▸ LAST 5 WEEKS</h2><div class="cal">${DOW.map(d => `<div class="dow">${d}</div>`).join('')}`;
  for (let i=0;i<35;i++){
    const d = addDays(start,i), mo = S.moods[d], mm = mo && MOODS.find(x => x.v === mo.v);
    const future = d > k;
    html += `<div class="cell ${mm?'has':''} ${d===k?'today':''}" style="${mm?`--c:${mm.c}`:''}${future?';opacity:.25':''}">${mm?mm.e:parseKey(d).getDate()}</div>`;
  }
  html += `</div>`;
  const notes = Object.entries(S.moods).filter(([,v]) => v.note).sort((a,b) => b[0].localeCompare(a[0])).slice(0,10);
  if (notes.length){
    html += `<h2>▸ JOURNAL</h2>` + notes.map(([d,v]) => { const mm = MOODS.find(x=>x.v===v.v);
      return `<div class="note" style="--c:${mm.c}"><small>${mm.e} ${parseKey(d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</small>${esc(v.note)}</div>`; }).join('');
  }
  return html;
}

function viewTrophies(){
  const L = levelOf(S.player.xp), got = BADGES.filter(b => S.badges[b.id]).length;
  const curStreak = S.habits.length ? Math.max(0, ...S.habits.map(h => streakOf(h, todayKey()))) : 0;
  const stat = (v,l) => `<div class="stat"><b>${v}</b><small>${l}</small></div>`;
  let html = `<h2>▸ STATS</h2><div class="stats">
    ${stat(L,'Level')}${stat(fmt(S.player.xp),'Total XP')}${stat(curStreak,'Streak now')}
    ${stat(S.stats.bestStreak,'Best streak')}${stat(S.stats.perfect,'Perfect days')}${stat(S.stats.maxCombo+'x','Max combo')}
    ${stat(S.stats.habits,'Check-ins')}${stat(S.stats.todos,'To-dos')}${stat(S.stats.goals,'Bosses')}
  </div>
  <h2>▸ ACHIEVEMENTS <span class="ct">${got}/${BADGES.length}</span></h2>
  <div class="badges">${BADGES.map(b => `<div class="badge ${S.badges[b.id]?'got':''}"><div class="bi">${b.i}</div><b>${b.n}</b><small>${b.d}</small></div>`).join('')}</div>
  <h2>▸ RANKS</h2><div class="titles">${TITLES.map(([l,t]) => `<div class="${titleOf(L)===t?'cur':''}">LV ${l} · ${t}${titleOf(L)===t?' ◂ you':''}</div>`).join('')}</div>`;
  return html;
}

function render(){
  document.documentElement.dataset.accent = S.settings.accent;
  document.body.classList.toggle('scan', !!S.settings.scan);
  if (ui.tab === 'today' && ui.day > todayKey()) ui.day = todayKey();
  renderHud(); renderTabs();
  const v = {today:viewToday, goals:viewGoals, mood:viewMood, trophies:viewTrophies}[ui.tab]();
  $('#view').innerHTML = v;
  ui.popId = null;
}

/* ============ sheets ============ */
let sheetState = {};
function openSheet(html){ $('#sheet').innerHTML = `<div class="grab"></div>` + html; $('#sheet').classList.add('open'); $('#scrim').classList.add('open'); }
function closeSheet(){ $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open'); sheetState = {}; }

function addMenu(){
  openSheet(`<h3>NEW QUEST</h3><div class="menu">
    <button data-a="newHabit"><span class="mi">🔁</span><div><b>DAILY QUEST</b><small>A habit you repeat. Builds streaks.</small></div></button>
    <button data-a="newTodo"><span class="mi">✅</span><div><b>SIDE QUEST</b><small>A one-off to-do.</small></div></button>
    <button data-a="newGoal"><span class="mi">👾</span><div><b>BOSS BATTLE</b><small>A big goal with milestones.</small></div></button>
  </div>`);
}

function emojiGrid(sel){ return `<div class="emojis">${EMOJIS.map(e => `<button type="button" class="${e===sel?'on':''}" data-a="pickEmoji" data-v="${e}">${e}</button>`).join('')}</div>`; }
function colorRow(sel){ return `<div class="swatches">${Object.entries(COLORS).map(([n,c]) => `<button type="button" class="sw ${n===sel?'on':''}" style="--c:${c}" data-a="pickColor" data-v="${n}" aria-label="${n}"></button>`).join('')}</div>`; }

function habitSheet(h){
  sheetState = {kind:'habit', id:h?.id, icon:h?.icon || '💧', color:h?.color || 'cyan', days:h ? [...h.days] : [0,1,2,3,4,5,6]};
  openSheet(`<h3>${h ? 'EDIT QUEST' : 'NEW DAILY QUEST'}</h3>
    <label class="lbl">Name</label><input class="field" id="fName" value="${esc(h?.name||'')}" placeholder="e.g. Drink 8 glasses of water" maxlength="60">
    <label class="lbl">Icon</label>${emojiGrid(sheetState.icon)}
    <label class="lbl">Color</label>${colorRow(sheetState.color)}
    <label class="lbl">Days</label><div class="days">${DOW.map((d,i) => `<button type="button" class="${sheetState.days.includes(i)?'on':''}" data-a="pickDay" data-v="${i}">${d}</button>`).join('')}</div>
    <div class="row">${h ? `<button class="btn danger" data-a="delHabit">DELETE</button>` : `<button class="btn ghost" data-a="close">CANCEL</button>`}<button class="btn" data-a="saveHabit">SAVE</button></div>`);
  if (!h) setTimeout(() => $('#fName').focus(), 300);
}
function goalSheet(g){
  sheetState = {kind:'goal', id:g?.id, icon:g?.icon || '👾', color:g?.color || 'purple'};
  openSheet(`<h3>${g ? 'EDIT BOSS' : 'NEW BOSS BATTLE'}</h3>
    <label class="lbl">Goal</label><input class="field" id="fName" value="${esc(g?.name||'')}" placeholder="e.g. Run a 5K" maxlength="60">
    ${g ? '' : `<label class="lbl">Milestones (one per line)</label><textarea class="field" id="fMs" placeholder="Run 1 mile&#10;Run 2 miles&#10;Sign up for a race"></textarea>`}
    <label class="lbl">Icon</label>${emojiGrid(sheetState.icon)}
    <label class="lbl">Color</label>${colorRow(sheetState.color)}
    <div class="row">${g ? `<button class="btn danger" data-a="delGoal">DELETE</button>` : `<button class="btn ghost" data-a="close">CANCEL</button>`}<button class="btn" data-a="saveGoal">SAVE</button></div>`);
  if (!g) setTimeout(() => $('#fName').focus(), 300);
}
function todoSheet(t){
  sheetState = {kind:'todo', id:t?.id};
  openSheet(`<h3>${t ? 'EDIT SIDE QUEST' : 'NEW SIDE QUEST'}</h3>
    <input class="field" id="fName" value="${esc(t?.text||'')}" placeholder="What needs doing?" maxlength="120">
    <div class="row">${t ? `<button class="btn danger" data-a="delTodo">DELETE</button>` : `<button class="btn ghost" data-a="close">CANCEL</button>`}<button class="btn" data-a="saveTodo">SAVE</button></div>`);
  setTimeout(() => $('#fName').focus(), 300);
}
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
function settingsSheet(){
  const tg = (k,l) => `<button class="toggle ${S.settings[k]?'on':''}" data-a="toggleSet" data-k="${k}" style="width:100%"><span>${l}</span><i></i></button>`;
  openSheet(`<h3>SETTINGS</h3>
    <label class="lbl">Player name</label><input class="field" id="fPlayer" value="${esc(S.player.name)}" maxlength="24">
    <label class="lbl">Neon theme</label><div class="swatches">${['pink','cyan','lime','gold','purple'].map(n => `<button class="sw ${S.settings.accent===n?'on':''}" style="--c:${COLORS[n]}" data-a="accent" data-v="${n}" aria-label="${n}"></button>`).join('')}</div>
    <div style="margin-top:14px">${tg('sound','🔊 Sound effects')}${tg('scan','📺 CRT scanlines')}</div>
    ${installEvt ? `<button class="btn block" data-a="install" style="margin-top:18px">📲 INSTALL APP</button>` : ''}
    <label class="lbl">Save file</label>
    <div class="row" style="margin-top:0"><button class="btn ghost" data-a="export">💾 BACKUP</button><button class="btn ghost" data-a="import">📂 RESTORE</button></div>
    <p style="color:var(--dim);font-size:13px;line-height:1.5">Your data lives only on this phone. Back up now and then so you never lose your streaks.</p>
    <button class="linkbtn" data-a="reset" style="color:#ff3e6c">Reset everything</button>`);
}

/* ============ events ============ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  switch (a){
    case 'tab': ui.tab = id; ui.mood = null; if (id==='today') ui.day = todayKey(); sfx.tap(); render(); scrollTo(0,0); break;
    case 'day': ui.day = addDays(ui.day, +el.dataset.d); sfx.tap(); render(); break;
    case 'habit': toggleHabit(id, el); break;
    case 'todo': toggleTodo(id, el); break;
    case 'ms': toggleMilestone(el.dataset.g, id, el); break;
    case 'goalToggle': { const g = S.goals.find(x => x.id===id); ui.openGoals[id] = !(ui.openGoals[id] ?? !g.done); render(); break; }
    case 'delMs': { e.stopPropagation(); const g = S.goals.find(x => x.id===el.dataset.g); const m = g.milestones.find(x => x.id===id);
      if (m.done && !confirm('Remove a completed milestone? Its XP stays.')) break;
      g.milestones = g.milestones.filter(x => x.id !== id); save(); render(); break; }
    case 'editHabit': e.stopPropagation(); habitSheet(S.habits.find(x => x.id===id)); break;
    case 'editTodo': e.stopPropagation(); todoSheet(S.todos.find(x => x.id===id)); break;
    case 'editGoal': e.stopPropagation(); goalSheet(S.goals.find(x => x.id===id)); break;
    case 'settings': settingsSheet(); break;
    case 'newHabit': habitSheet(); break;
    case 'newTodo': todoSheet(); break;
    case 'newGoal': goalSheet(); break;
    case 'close': closeSheet(); break;
    case 'pickEmoji': sheetState.icon = el.dataset.v; el.parentNode.querySelectorAll('.on').forEach(x => x.classList.remove('on')); el.classList.add('on'); break;
    case 'pickColor': sheetState.color = el.dataset.v; el.parentNode.querySelectorAll('.on').forEach(x => x.classList.remove('on')); el.classList.add('on'); break;
    case 'pickDay': { const v = +el.dataset.v; const i = sheetState.days.indexOf(v);
      if (i >= 0){ if (sheetState.days.length > 1){ sheetState.days.splice(i,1); el.classList.remove('on'); } } else { sheetState.days.push(v); el.classList.add('on'); } break; }
    case 'saveHabit': {
      const name = $('#fName').value.trim(); if (!name) { $('#fName').focus(); break; }
      if (sheetState.id){ Object.assign(S.habits.find(x => x.id===sheetState.id), {name, icon:sheetState.icon, color:sheetState.color, days:sheetState.days.sort()}); }
      else S.habits.push({id:uid(), name, icon:sheetState.icon, color:sheetState.color, days:sheetState.days.sort(), created:todayKey()});
      closeSheet(); ui.tab = 'today'; save(); render(); break; }
    case 'delHabit': if (confirm('Delete this quest? XP you earned stays.')) { S.habits = S.habits.filter(x => x.id !== sheetState.id); closeSheet(); save(); render(); } break;
    case 'saveTodo': {
      const text = $('#fName').value.trim(); if (!text) break;
      if (sheetState.id) S.todos.find(x => x.id===sheetState.id).text = text;
      else S.todos.unshift({id:uid(), text, done:false, created:todayKey()});
      closeSheet(); ui.tab = 'today'; ui.day = todayKey(); save(); render(); break; }
    case 'delTodo': S.todos = S.todos.filter(x => x.id !== sheetState.id); closeSheet(); save(); render(); break;
    case 'saveGoal': {
      const name = $('#fName').value.trim(); if (!name) { $('#fName').focus(); break; }
      if (sheetState.id) Object.assign(S.goals.find(x => x.id===sheetState.id), {name, icon:sheetState.icon, color:sheetState.color});
      else S.goals.unshift({id:uid(), name, icon:sheetState.icon, color:sheetState.color, done:false, created:todayKey(),
        milestones:$('#fMs').value.split('\n').map(s => s.trim()).filter(Boolean).map(text => ({id:uid(), text, done:false}))});
      closeSheet(); ui.tab = 'goals'; save(); render(); break; }
    case 'delGoal': if (confirm('Delete this boss? XP you earned stays.')) { S.goals = S.goals.filter(x => x.id !== sheetState.id); closeSheet(); save(); render(); } break;
    case 'face': ui.mood = +el.dataset.v; { const note = $('#moodNote').value; render(); $('#moodNote').value = note; } sfx.tap(); break;
    case 'saveMood': if (ui.mood || S.moods[todayKey()]) { const v = ui.mood ?? S.moods[todayKey()].v; saveMood(v, $('#moodNote').value); ui.mood = null; } break;
    case 'accent': S.settings.accent = el.dataset.v; save(); render(); settingsSheet(); break;
    case 'toggleSet': S.settings[el.dataset.k] = !S.settings[el.dataset.k]; save(); render(); el.classList.toggle('on', S.settings[el.dataset.k]); break;
    case 'install': installEvt.prompt(); installEvt = null; closeSheet(); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
      const u = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = u; link.download = `habit-arcade-backup-${todayKey()}.json`; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(u), 2000); break; }
    case 'import': $('#importFile').click(); break;
    case 'reset': if (confirm('Erase ALL progress? This cannot be undone.') && confirm('Really? Level, streaks, badges — everything.')) { S = fresh(); save(); closeSheet(); render(); } break;
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const text = f.text.value.trim(); if (!text) return;
  if (f.dataset.form === 'todo') S.todos.unshift({id:uid(), text, done:false, created:todayKey()});
  if (f.dataset.form === 'ms'){
    const g = S.goals.find(x => x.id === f.dataset.g);
    g.milestones.push({id:uid(), text, done:false}); ui.openGoals[g.id] = true;
  }
  sfx.tap(); save(); render();
  const again = document.querySelector(`form[data-form="${f.dataset.form}"]${f.dataset.g?`[data-g="${f.dataset.g}"]`:''} input`);
  if (again) again.focus();
});
$('#scrim').addEventListener('click', closeSheet);
$('#fab').addEventListener('click', () => { sfx.tap(); ui.tab === 'goals' ? goalSheet() : addMenu(); });
document.addEventListener('change', e => { if (e.target.id === 'fPlayer'){ S.player.name = e.target.value.trim() || 'Player 1'; save(); render(); } });
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data.player || !Array.isArray(data.habits)) throw new Error('bad');
    if (confirm(`Restore save from this file? (Level ${levelOf(data.player.xp)}, ${data.habits.length} quests) Current progress will be replaced.`)){
      S = Object.assign(fresh(), data); S.stats = Object.assign(fresh().stats, data.stats); S.settings = Object.assign(fresh().settings, data.settings);
      save(); closeSheet(); render(); toast('💾','SAVE RESTORED','Welcome back, ' + S.player.name);
    }
  } catch(err) { alert("That file doesn't look like a Habit Arcade backup."); }
});
// refresh when the day rolls over or the app comes back to the foreground
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
setInterval(() => { if (!$('#sheet').classList.contains('open') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') renderHud(); }, 30000);

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
